# nginx 站点配置示例（deploy 目录里的仓内版本；部署时复制到 nginx 站点目录）
# 链路：官方远控页面（本地镜像 + miss 回源 zcode.z.ai）→ relay(3032) 下发 wsUrl →
#       页面原生 ChannelServer RPC → server(3030)（凭设备会话 Cookie，无 query token）
# ⚠ 运行生效的是 nginx 站点目录里的副本（本文件是仓内版本 deploy/nginx-zcode.conf）。
#   部署流程：cp 本文件过去 → nginx -t → systemctl reload nginx（reload 不断连接）。
#   v29 变更：新增 /api/relay/ location（POST /api/relay/ticket 门票签发，
#   relay 自鉴权=设备会话 Cookie）。漏配时该端点落 server(3030) 返回 404，
#   直连页无法自助签发门票（远控页自助/legacy 入口不受影响）。
#   本文件同时含 zusage/3033、/app、/login、/api/admin/ 403、sub_filter 注入段。
#   sub_filter 注入段）——同步后运行/仓内两份一致。
upstream zcode_web {
    server 127.0.0.1:3030;
    keepalive 8;
}
upstream zcode_relay {
    server 127.0.0.1:3032;
    keepalive 4;
}
# ZCode Token 状态栏旁挂服务（只读 db.sqlite，见 zusage-sidecar.service）
upstream zusage_sidecar {
    server 127.0.0.1:3033;
    keepalive 4;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <部署域名>;

    ssl_certificate     /etc/letsencrypt/live/<部署域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<部署域名>/privkey.pem;

    # ---- ZCode mobile APP 下载/上传（独立服务 3035，404 就是 404）----
    # 不放进 ZCode server 的静态目录：那边对 miss 做 SPA fallback（返回 index.html），
    # 过期链接会被当成网页打开。这里独立服务，文件删了就是真 404。
    # 换为自写服务 <APK 分发目录>-server/server.py（下载支持 Range 断点续传），
    # 新增密钥保护的上传页 /app/upload?key=<token>；token 在服务器
    # <APK 分发目录>-server/upload-token（0600，不在被服务的目录里）。
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:3035/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 256m;
        proxy_read_timeout 300s;
    }

    # ---- ZCode Token 状态栏（旁挂服务 3033，只读）----
    # 静态脚本 + 快照接口；接口自校验设备会话 Cookie（透传 3030），把关在本服务而非 ZCode。
    # X-Real-IP：会话校验透传在 3030 侧按其限流（600/10min/IP），透传是限流前提。
    location ^~ /zusage/ {
        proxy_pass http://zusage_sidecar;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # 配对登录短地址 → 服务器内置配对页
    location = /login {
        proxy_pass http://zcode_web/api/pairing/page;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- v29 relay（3032）----
    # 门票签发：POST /api/relay/ticket（浏览器设备会话 Cookie 鉴权，relay 透传 3030 校验）。
    # v29 新增——必须先于 location / 命中（^~ 前缀优先），否则落 3030 得 404。
    location ^~ /api/relay/ {
        proxy_pass http://zcode_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # 入口页：/web-remote?ticket=<票>（v29 主链）| ?remoteControlToken=<旧token>（过渡兼容）。
    # relay 校验/消费门票后 302 到参数模式；官方 bundle 硬性要求 remoteControlToken 参数。
    location ^~ /web-remote {
        proxy_pass http://zcode_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # sub_filter 要在未压缩的明文上匹配 </head>；出站压缩由 nginx 的 gzip 负责，不冲突
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script src="/zcode-boot-probe.js"></script><script src="/zusage/boot.js"></script></head>';
        proxy_read_timeout 300s;
    }
    # 官方页面静态资源（/remote/v4/3.14.3/assets/*）；远控页入口 /remote/v4 也落在这里
    location ^~ /remote/ {
        proxy_pass http://zcode_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        # sub_filter 默认只作用于 text/html，JS/CSS 资源不受影响
        sub_filter '</head>' '<script src="/zcode-boot-probe.js"></script><script src="/zusage/boot.js"></script></head>';
        proxy_read_timeout 300s;
    }
    # relay 实现的直连流接口（bootstrap/workspace-bridge/mobile-view-state/platform；
    # v29 鉴权 = 有效票（已入場、10 分钟内）或旧 token + 设备会话 Cookie 双因子）
    location ^~ /api/remote-control/ {
        proxy_pass http://zcode_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
    # 远控页离线化：官方 client/configs 由 relay 镜像应答。漏配时落到 server(3030)
    # 被会话中间件 401——远控页启动链路每次都会报错。
    location = /api/v1/client/configs {
        proxy_pass http://zcode_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
    }
    # 控制通道 WebSocket（window-control-ready）——必须带 Upgrade 头
    location ^~ /ws/remote-control/ {
        proxy_pass http://zcode_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 管理端点：只允许本机直连，公网一律 403（设备凭据模型）----
    # 管理 API 由服务端自己校验"本机直连 + x-zcode-admin 密钥"；
    # 这里是第二道闸：经 443 的请求根本不进 3030。^~ 保证不被 location / 吞掉。
    location ^~ /api/admin/ {
        return 403;
    }

    # ---- ZCode server（3030）：直连页、/api/*、/ws（真 RPC 通道，凭会话 Cookie）----
    location / {
        proxy_pass http://zcode_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # X-Real-IP：/api/pairing/redeem 的每 IP 限流依赖它（设备凭据模型）。
        # 不透传时服务端 fallback 到 socket 地址 = 127.0.0.1，全体公网用户共享一个限流桶。
        proxy_set_header X-Real-IP $remote_addr;
        # sub_filter 需要上游明文；且默认只作用于 text/html，
        # 所以 5.94MB 的主 bundle 不会被扫描
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script src="/zcode-boot-probe.js"></script><script src="/zusage/boot.js"></script></head>';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
